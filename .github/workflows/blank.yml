# This is a basic workflow to help you get started with Actions

name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          if [ -f GlassLauncher.zip ]; then unzip -oq GlassLauncher.zip; fi
          test -d GlassLauncher
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build debug APK
        working-directory: GlassLauncher
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GlassLauncher-apk
          path: GlassLauncher/app/build/outputs/apk/debug/*.apk
          
